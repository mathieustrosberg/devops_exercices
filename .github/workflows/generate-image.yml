# ============================================================
# Exercice 02 — Génération d'Image via IA & GitHub Pages
# ============================================================
# Ce workflow :
#   - Récupère le message du dernier commit
#   - Envoie ce message à l'API DynaPictures pour générer une image
#   - Sauvegarde l'image dans /images/
#   - Génère un index.html listant toutes les images
#   - Déploie le tout sur GitHub Pages
#
# Prérequis :
#   - Ajouter DYNAPICTURES_API_KEY dans les Secrets du dépôt
#   - Ajouter DYNAPICTURES_TEMPLATE_UID dans les Secrets du dépôt
#   - Activer GitHub Pages (Settings > Pages > Source: gh-pages branch)

name: "Exercice 02 - Génération Image IA & Déploiement GitHub Pages"

on:
  push:
    branches:
      - exercice-02
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    name: Générer l'image et déployer sur GitHub Pages
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Checkout du code
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Étape 2 : Récupérer le message du dernier commit
      - name: Récupérer le message du commit
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "Commit message : $COMMIT_MSG"

      # Étape 3 : Générer une image via l'API DynaPictures
      - name: Générer l'image via DynaPictures
        id: generate
        run: |
          TIMESTAMP=$(date +%s)
          IMAGE_NAME="image-${TIMESTAMP}.png"

          # Appel API DynaPictures
          RESPONSE=$(curl -s -X POST \
            "https://api.dynapictures.com/designs/${{ secrets.DYNAPICTURES_TEMPLATE_UID }}" \
            -H "Authorization: Bearer ${{ secrets.DYNAPICTURES_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"params\":[{\"name\":\"Headline\",\"text\":\"${{ steps.commit.outputs.message }}\"}]}")

          echo "Réponse API : $RESPONSE"

          # Extraction de l'URL de l'image depuis la réponse JSON
          IMAGE_URL=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('imageUrl', ''))")
          echo "URL de l'image : $IMAGE_URL"
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      # Étape 4 : Télécharger et sauvegarder l'image
      - name: Télécharger l'image générée
        run: |
          mkdir -p images
          curl -L "${{ steps.generate.outputs.image_url }}" \
            -o "images/${{ steps.generate.outputs.image_name }}"
          echo "Image sauvegardée : images/${{ steps.generate.outputs.image_name }}"

      # Étape 5 : Générer le fichier index.html
      - name: Générer le fichier index.html
        run: |
          cat > images/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>GitHub Actions — Images Générées</title>
            <style>
              body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
              h1 { color: #333; }
              .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
              .card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
              img { width: 100%; border-radius: 4px; }
              p { font-size: 0.85rem; color: #666; margin-top: 8px; word-break: break-all; }
            </style>
          </head>
          <body>
            <h1>🎨 Images Générées par GitHub Actions</h1>
            <div class="gallery">
          EOF

          # Ajouter une card pour chaque image
          for img in images/*.png images/*.jpg; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            echo "    <div class=\"card\"><img src=\"$filename\" alt=\"$filename\"><p>$filename</p></div>" >> images/index.html
          done

          cat >> images/index.html << 'EOF'
            </div>
          </body>
          </html>
          EOF

          echo "index.html généré avec succès"

      # Étape 6 : Déployer sur GitHub Pages
      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./images
          keep_files: true   # Conserve les images des déploiements précédents
