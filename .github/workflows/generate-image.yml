name: "Exercice 02 - Génération Image IA & Déploiement GitHub Pages"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    name: Générer l'image et déployer sur GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer le message du commit
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "Commit message : $COMMIT_MSG"

      - name: Installer ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Générer l'image avec ImageMagick
        id: generate
        env:
          COMMIT_MSG: ${{ steps.commit.outputs.message }}
        run: |
          mkdir -p images
          TIMESTAMP=$(date +%s)
          IMAGE_NAME="image-${TIMESTAMP}.png"

          MSG_CLEAN=$(echo "$COMMIT_MSG" | head -c 60)
          DATE=$(date +"%d/%m/%Y")

          convert -size 800x400 gradient:"#4F46E5-#7C3AED" \
            -fill white \
            -font "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" \
            -pointsize 36 \
            -gravity Center \
            -annotate +0-30 "$MSG_CLEAN" \
            -pointsize 20 \
            -annotate +0+60 "$DATE" \
            "images/$IMAGE_NAME"

          echo "Image générée : images/$IMAGE_NAME"
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Générer le fichier index.html
        run: |
          cat > images/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>GitHub Actions — Images Générées</title>
            <style>
              body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
              h1 { color: #333; }
              .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
              .card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
              img { width: 100%; border-radius: 4px; }
              p { font-size: 0.85rem; color: #666; margin-top: 8px; word-break: break-all; }
            </style>
          </head>
          <body>
            <h1>🎨 Images Générées par GitHub Actions</h1>
            <div class="gallery">
          EOF

          for img in images/*.png images/*.jpg; do
            [ -f "$img" ] || continue
            filename=$(basename "$img")
            echo "    <div class=\"card\"><img src=\"$filename\" alt=\"$filename\"><p>$filename</p></div>" >> images/index.html
          done

          cat >> images/index.html << 'EOF'
            </div>
          </body>
          </html>
          EOF

      - name: Uploader l'image comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: image-generee
          path: images/${{ steps.generate.outputs.image_name }}

      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./images
          keep_files: true
