# ============================================================
# Exercice 03 — Notification Discord avec URL Dynamique de l'Image
# ============================================================
# Ce workflow :
#   - Se déclenche après la fin du workflow de génération d'image
#   - Télécharge l'artefact contenant l'image générée
#   - Extrait dynamiquement le nom du fichier image
#   - Construit l'URL de l'image hébergée sur GitHub Pages
#   - Envoie une notification Discord avec le message du commit et l'image
#
# Prérequis :
#   - Ajouter DISCORD_WEBHOOK_URL dans les Secrets du dépôt
#   - S'assurer que le workflow generate-image.yml uploade l'artefact image-generee

name: "Exercice 03 - Notification Discord avec URL Dynamique"

on:
  workflow_run:
    workflows: ["Exercice 02 - Génération Image IA & Déploiement GitHub Pages"]
    types:
      - completed

permissions:
  actions: read

jobs:
  notify-discord:
    name: Envoyer une notification Discord
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Étape 1 : Checkout du dépôt au commit qui a déclenché le workflow
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Étape 2 : Récupérer le message du commit
      - name: Récupérer le message du commit
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "Commit message : $COMMIT_MSG"

      # Étape 3 : Télécharger l'artefact image-generee
      - name: Télécharger l'artefact image-generee
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Étape 4 : Extraire dynamiquement le nom du fichier image
      - name: Extraire le nom du fichier image
        id: image
        run: |
          IMAGE_NAME=$(ls ./artifacts/ | head -n 1)
          echo "Fichier image trouvé : $IMAGE_NAME"
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      # Étape 5 : Construire l'URL de l'image hébergée sur GitHub Pages
      - name: Construire l'URL de l'image
        id: url
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          IMAGE_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/${{ steps.image.outputs.name }}"
          echo "URL de l'image : $IMAGE_URL"
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT

      # Étape 6 : Envoyer la notification Discord via le Webhook
      - name: Envoyer la notification Discord
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Nouvelle Image Générée !\",
                \"description\": \"**Message du commit :**\n${{ steps.commit.outputs.message }}\",
                \"color\": 5814783,
                \"image\": {
                  \"url\": \"${{ steps.url.outputs.image_url }}\"
                },
                \"fields\": [{
                  \"name\": \"🖼️ Lien de l'image\",
                  \"value\": \"${{ steps.url.outputs.image_url }}\"
                }]
              }]
            }"
          echo "Notification Discord envoyée avec succès !"
