name: "Exercice 03 - Notification Discord avec URL Dynamique"

on:
  workflow_run:
    workflows: ["Exercice 02 - Génération Image IA & Déploiement GitHub Pages"]
    types:
      - completed

permissions:
  actions: read

jobs:
  notify-discord:
    name: Envoyer une notification Discord
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Récupérer le message du commit
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Télécharger l'artefact image-generee
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire le nom du fichier image
        id: image
        run: |
          IMAGE_NAME=$(ls ./artifacts/ | head -n 1)
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Construire l'URL de l'image
        id: url
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          IMAGE_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/${{ steps.image.outputs.name }}"
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT

      - name: Envoyer la notification Discord
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Nouvelle Image Générée !\",
                \"description\": \"**Message du commit :**\n${{ steps.commit.outputs.message }}\",
                \"color\": 5814783,
                \"image\": {
                  \"url\": \"${{ steps.url.outputs.image_url }}\"
                },
                \"fields\": [{
                  \"name\": \"🖼️ Lien de l'image\",
                  \"value\": \"${{ steps.url.outputs.image_url }}\"
                }]
              }]
            }"
