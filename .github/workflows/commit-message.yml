name: "Exercice 01 - Message du Commit"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  afficher-message-commit:
    name: Récupérer et afficher le message du commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Afficher le message du dernier commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "============================================"
          echo "  Message du dernier commit :"
          echo "  $COMMIT_MSG"
          echo "============================================"
