name: "Exercice 05 - Mise à jour du badge dynamique"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-badge:
    name: Mettre à jour le badge dynamique
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compter le nombre de commits
        id: count
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "Nombre de commits : $COUNT"
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Mettre à jour le badge dynamique
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: badge-commits.json
          label: commits
          message: ${{ steps.count.outputs.count }}
          color: blue
