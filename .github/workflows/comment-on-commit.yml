name: "Exercice 04 - Commentaire Automatique sur le Commit"

on:
  workflow_run:
    workflows: ["Exercice 02 - Génération Image IA & Déploiement GitHub Pages"]
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  comment-on-commit:
    name: Ajouter un commentaire sur le commit
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Récupérer le message du commit
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Télécharger l'artefact image-generee
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire le nom du fichier image
        id: image
        run: |
          IMAGE_NAME=$(ls ./artifacts/ | head -n 1)
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Construire l'URL de l'image
        id: url
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          IMAGE_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/${{ steps.image.outputs.name }}"
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT

      - name: Ajouter un commentaire sur le commit
        uses: actions/github-script@v6
        env:
          IMAGE_URL: ${{ steps.url.outputs.image_url }}
          COMMIT_MSG: ${{ steps.commit.outputs.message }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commitSha = '${{ github.event.workflow_run.head_sha }}';
            const imageUrl = process.env.IMAGE_URL;
            const commitMsg = process.env.COMMIT_MSG;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              body: `🎨 **Image générée automatiquement pour ce commit !**\n\n**Message du commit :** ${commitMsg}\n\n![Image générée](${imageUrl})\n\n🔗 **Lien de l'image :** ${imageUrl}`
            });
